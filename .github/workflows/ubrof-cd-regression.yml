name: UBROF CD candidate regression

on:
  push:
    branches:
      - feature/sdcc-build
    paths:
      - 'tools/audit_cd_candidate_safe.py'
      - 'tools/audit_cd_5d_crosscheck.py'
      - 'tools/compare_cd_5d_samples.py'
      - 'tools/audit_prefix_boundaries.py'
      - '.github/workflows/ubrof-cd-regression.yml'
  pull_request:
    paths:
      - 'tools/audit_cd_candidate_safe.py'
      - 'tools/audit_cd_5d_crosscheck.py'
      - 'tools/compare_cd_5d_samples.py'
      - 'tools/audit_prefix_boundaries.py'
      - '.github/workflows/ubrof-cd-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cd-candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Run CD candidate regression tests
        run: python3 tools/audit_cd_candidate_safe.py --self-test
      - name: Run CD/5D cross-check regression tests
        run: python3 tools/audit_cd_5d_crosscheck.py --self-test
      - name: Run cross-sample synthetic regression tests
        run: python3 tools/compare_cd_5d_samples.py --self-test
      - name: Run repeated-prefix boundary falsification tests
        run: python3 tools/audit_prefix_boundaries.py --self-test
