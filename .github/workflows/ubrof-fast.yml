name: UBROF fast research
on:
  push:
    branches: [feature/sdcc-build]
    paths: ['tools/*ubrof*.py', '.github/workflows/ubrof-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate conservative R51 prefix parser (synthetic tests only)
        run: |
          python3 tools/audit_iar_ubrof_prefix.py --self-test
          python3 tools/test_ubrof_c1_metamorphic.py
      - name: Fetch pinned research inputs
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ms-rtos/ti_cc2530_zstack.git sdk-public
          git -C sdk-public sparse-checkout init --no-cone
          git -C sdk-public sparse-checkout set '/Z-Stack 3.0.2/Projects/zstack/Libraries/TI2530DB/bin/EndDevice-Pro.lib' '/Z-Stack 3.0.2/Projects/zstack/Libraries/TI2530DB/bin/Router-Pro.lib' '/Z-Stack 3.0.2/Projects/zstack/Libraries/TI2530DB/bin/ecc.r51'
          git -C sdk-public checkout 240a9e350de981e10f6f364cf62e3ccf3973c494
          git clone https://github.com/devbis/sdcc_iar.git sdcc-converter
          git -C sdcc-converter checkout 181e75662ba181efa9a88251454c9418025a0740
      - name: Run record research without SDCC build
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/sdcc-converter/tools"
          lib="sdk-public/Z-Stack 3.0.2/Projects/zstack/Libraries/TI2530DB/bin/EndDevice-Pro.lib"
          python3 tools/audit_iar_binary_layout.py "$lib" --out "$RUNNER_TEMP/layout" --limit 8
          python3 tools/decode_ubrof_prefix.py "$RUNNER_TEMP/layout" --out "$RUNNER_TEMP/layout/record-prefix.json"
          mkdir -p reports
          python3 tools/check_ubrof_independence.py "$RUNNER_TEMP/layout" --out reports/independence.json
          python3 tools/scan_ubrof_boundaries.py "$lib" --out reports/boundaries.json
          router="${lib%/*}/Router-Pro.lib"
          python3 tools/scan_ubrof_boundaries.py "$router" --out reports/router-boundaries.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a,b=[json.loads(Path(p).read_text()) for p in ("reports/boundaries.json","reports/router-boundaries.json")]
          assert a["archive_sha256"] != b["archive_sha256"], "inputs must be distinct"
          for name,r in (("EndDevice",a),("Router",b)):
              print(name, "candidates",r["candidate_count"],"unique",r["unique_prefix_count"])
          common=set(x["sha256"] for x in a["candidates"]) & set(x["sha256"] for x in b["candidates"])
          print("Cross-library common prefix hashes:",len(common))
          Path("reports/cross-library.json").write_text(json.dumps({"shared_prefix_count":len(common),"distinct_inputs":True,"member_boundaries_verified":False}))
          PY
          python3 - "$lib" "$router" <<'PY'
          import sys,json,hashlib
          from pathlib import Path
          a,b=[json.loads(Path(p).read_text()) for p in ("reports/boundaries.json","reports/router-boundaries.json")]
          da,db=[Path(p).read_bytes() for p in sys.argv[1:]]
          rows=[]
          for x in a["candidates"]:
              for y in b["candidates"]:
                  if x["sha256"]!=y["sha256"]:
                      continue
                  u=da[x["end"]:x["end"]+65536]
                  v=db[y["end"]:y["end"]+65536]
                  n=min(len(u),len(v))
                  first=next((i for i in range(n) if u[i]!=v[i]),n)
                  rows.append({"enddevice_offset":x["end"],"router_offset":y["end"],"compared_bytes":n,"common_bytes":first})
          assert rows
          print("Cross-library pair count:",len(rows))
          print("Cross-library common following lengths:",sorted(set(r["common_bytes"] for r in rows)))
          Path("reports/cross-library-following.json").write_text(json.dumps({"pairs":rows,"member_boundaries_verified":False,"executable_conversion":False}))
          PY
          python3 tools/scan_ubrof_boundaries.py "${lib%/*}/ecc.r51" --out reports/standalone-ecc.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/standalone-ecc.json").read_text())
          print("Standalone object candidates:",r["candidate_count"])
          print("Standalone object size:",r["archive_size"])
          print("Standalone next tags:",[x["next_tag"] for x in r["candidates"]])
          PY
          # 独立对象：检验 C1 后是否存在其他可严格解析的属性锚点。
          python3 - "${lib%/*}/ecc.r51" <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,"tools")
          from decode_ubrof_prefix import decode
          def anchors(data,start):
              rows=[]
              for p in range(start,len(data)-4):
                  if data[p:p+4]!=b"\xc9\x00\x00\x00":
                      continue
                  try:
                      r=decode(data[p:])
                  except (ValueError,UnicodeError):
                      continue
                  if r["start"]==0 and r["counts"].get("0xc9",0):
                      rows.append({"offset":p,"end":p+r["stop"],"counts":r["counts"]})
              return rows
          def attr(k,v):
              body=len(k).to_bytes(4,"big")+k+len(v).to_bytes(4,"big")+v
              return b"\xc9"+len(body).to_bytes(4,"big")+body
          sample=b"noise"+attr(b"a",b"b")
          assert anchors(sample,0)[0]["offset"]==5
          assert not anchors(sample,6)
          assert not anchors(b"\xc9\x00\x00\x00\xff",0)
          data=Path(sys.argv[1]).read_bytes()
          r=decode(data)
          rows=anchors(data,r["stop"]+1)
          report={"stop":r["stop"],"size":len(data),"strict_suffix_anchors":rows,
                  "record_semantics_verified":False,"executable_conversion":False}
          Path("reports/ecc-suffix-anchors.json").write_text(json.dumps(report))
          print("Standalone suffix strict anchors:",len(rows))
          print("Standalone suffix anchor offsets:",[x["offset"] for x in rows])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ubrof-fast-aggregate-NOT-FIRMWARE
          path: reports/*.json
          if-no-files-found: error
