name: CC2530 Open Zigbee stack evaluation
on:
  push:
    branches: [feature/sdcc-build]
    paths:
      - '.github/workflows/cc2530-open-zigbee-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-upstream-cc2530:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout open CC2530 Zigbee firmware
        uses: actions/checkout@v4
        with:
          repository: faronov/cc2530-zigbee
          ref: 655438fb1c54fe9f97cc30950c66ecdaddc20846
          path: firmware-upstream
          persist-credentials: false
      - name: Checkout pinned LLVM MCS51 toolchain
        uses: actions/checkout@v4
        with:
          repository: faronov/llvm-project
          ref: 2c3d9541c965dee8d3e35bdc81ea494e4ab02dc2
          path: llvm
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache lld python3 python3-pyelftools bison flex m4 libboost-dev zlib1g-dev
      - name: Build pinned LLVM MCS51 compiler
        run: |
          cmake -S llvm/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_PROJECTS='clang;lld' -DLLVM_TARGETS_TO_BUILD=MCS51 \
            -DLLVM_INCLUDE_TESTS=ON -DCLANG_INCLUDE_TESTS=ON -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_USE_LINKER=lld -DLLVM_PARALLEL_LINK_JOBS=2
          ninja -C llvm-build clang lld llc llvm-mc llvm-objdump llvm-objcopy llvm-ar llvm-readobj llvm-config FileCheck not count split-file mcs51-runtime
      - name: Build upstream CC2530 Zigbee join image (LG board reference, NOT Halo)
        working-directory: firmware-upstream
        run: |
          make firmware BOARD=lg_esl29_rev03 IMAGE=join \
            LLVM_TOOLS="$GITHUB_WORKSPACE/llvm-build/bin" \
            LLVM_REVISION=2c3d9541c965dee8d3e35bdc81ea494e4ab02dc2 \
            LLVM_SRC="$GITHUB_WORKSPACE/llvm" \
            BUILD=build/ci-lg-join
          test -s build/ci-lg-join/firmware.hex
          test -s build/ci-lg-join/firmware.elf
          test -s build/ci-lg-join/receipt.json
          sha256sum build/ci-lg-join/firmware.hex | tee build/ci-lg-join/SHA256SUMS.txt
      - name: Upload reference build (NOT HALO FIRMWARE)
        uses: actions/upload-artifact@v4
        with:
          name: upstream-cc2530-zigbee-lg-join-reference-NOT-HALO
          path: |
            firmware-upstream/build/ci-lg-join/firmware.hex
            firmware-upstream/build/ci-lg-join/firmware.elf
            firmware-upstream/build/ci-lg-join/receipt.json
            firmware-upstream/build/ci-lg-join/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
