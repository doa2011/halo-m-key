name: Halo SDCC-IAR toolchain probe
on:
  push:
    branches: [feature/sdcc-build]
    paths: ['.github/workflows/halo-sdcc-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake make gcc-11 g++-11 bison flex python3 jq libboost-dev libtool texinfo libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev
      - name: Cache installed SDCC toolchain
        id: sdcc-cache
        uses: actions/cache@v4
        with:
          path: sdcc-install
          key: sdcc-iar-ubuntu24-gcc11-mcs51-181e756-${{ runner.arch }}-${{ hashFiles('.github/workflows/halo-sdcc-probe.yml') }}
      - name: Build pinned SDCC fork
        if: steps.sdcc-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/devbis/sdcc_iar.git sdcc
          git -C sdcc checkout 181e75662ba181efa9a88251454c9418025a0740
          mkdir sdcc-build
          cd sdcc-build
          export CC=gcc-11 CXX=g++-11
          "$CC" --version
          "$CXX" --version
          ../sdcc/configure --prefix="$GITHUB_WORKSPACE/sdcc-install" --disable-sdcdb --disable-ucsim --disable-pic14-port --disable-pic16-port --disable-z80-port --disable-z180-port --disable-r2k-port --disable-r2ka-port --disable-r3ka-port --disable-r4k-port --disable-r5k-port --disable-r6k-port --disable-sm83-port --disable-tlcs90-port --disable-ez80-port --disable-z80n-port --disable-r800-port --disable-ds390-port --disable-ds400-port --disable-hc08-port --disable-s08-port --disable-stm8-port --disable-pdk13-port --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port --disable-mos65c02-port --disable-f8-port --disable-f8l-port
          make -j2
          make install
      - name: Activate installed toolchain
        run: |
          echo "$GITHUB_WORKSPACE/sdcc-install/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/sdcc-install/bin/sdcc" --version
          find "$GITHUB_WORKSPACE/sdcc-install" -name mcs51.lib -print
      - name: Native ABI baseline and freestanding IAR ABI link probe (not firmware)
        run: |
          sdcc --print-search-dirs
          mkdir -p probe
          cd probe
          printf 'volatile __xdata unsigned char value;\nvoid main(void){value=42; for(;;){}}\n' > abi_probe.c
          sdcc -mmcs51 abi_probe.c
          packihx abi_probe.ihx > native-baseline.hex
          test -s native-baseline.hex
          # Separate IAR ABI objects; no native runtime or startup.
          printf 'unsigned char add_pair(unsigned char a, unsigned char b){return a+b;}\n' > iar_callee.c
          printf 'extern unsigned char add_pair(unsigned char, unsigned char);\nvolatile __xdata unsigned char result;\nvoid probe_entry(void){result=add_pair(19,23);}\n' > iar_caller.c
          sdcc -mmcs51 --abi-iar -c iar_callee.c
          sdcc -mmcs51 --abi-iar -c iar_caller.c
          sdcc -mmcs51 --abi-iar --nostdlib -o iar-link.ihx iar_caller.rel iar_callee.rel
          packihx iar-link.ihx > iar-link-NOT-BOOTABLE.hex
          test -s iar-link-NOT-BOOTABLE.hex
      - name: Check upstream IAR conversion CLI
        run: |
          git clone https://github.com/devbis/sdcc_iar.git sdcc-converter
          git -C sdcc-converter checkout 181e75662ba181efa9a88251454c9418025a0740
          python3 sdcc-converter/tools/iar2sdcc/cli.py --help
          python3 sdcc-converter/tools/iar2sdcc/cli.py scan --help
          python3 sdcc-converter/tools/iar2sdcc/cli.py convert --help
      - name: Scan public Z-Stack SDK libraries (research only)
        run: |
          git clone https://github.com/ms-rtos/ti_cc2530_zstack.git sdk-public
          git -C sdk-public checkout 240a9e350de981e10f6f364cf62e3ccf3973c494
          sdk="$GITHUB_WORKSPACE/sdk-public/Z-Stack 3.0.2"
          libs="$sdk/Projects/zstack/Libraries/TI2530DB/bin"
          for lib in Router-Pro EndDevice-Pro; do
            test -s "$libs/$lib.lib"
            sha256sum "$libs/$lib.lib"
            python3 sdcc-converter/tools/iar2sdcc/cli.py scan --json "$libs/$lib.lib" | tee "$RUNNER_TEMP/$lib-scan.json"
            python3 -m json.tool "$RUNNER_TEMP/$lib-scan.json" >/dev/null
          done
      - name: Collect SDK diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp "$RUNNER_TEMP/"*scan.json diagnostics/ 2>/dev/null || true
          find "sdk-public/Z-Stack 3.0.2/Projects/zstack/HomeAutomation/AcoinfoZigBeeSampleLight/CC2530DB" -maxdepth 1 -name "*.ewp" -print > diagnostics/available-projects.txt
          printf "SDK commit: 240a9e350de981e10f6f364cf62e3ccf3973c494\\n" > diagnostics/SDK-INFO.txt
          sha256sum "sdk-public/Z-Stack 3.0.2/Projects/zstack/Libraries/TI2530DB/bin/"*.lib >> diagnostics/SDK-INFO.txt
      - name: Prepare Halo FreePad EndDevice source
        run: |
          git clone --recurse-submodules https://github.com/diyruz/freepad.git freepad
          python3 firmware/halo/prepare_halo_freepad.py freepad
          python3 tools/check_halo_port.py freepad
          mkdir -p halo-source-diagnostics
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("freepad/CC2530DB/GenericApp.ewp")
          root=ET.parse(p).getroot()
          for cfg in root.findall(".//configuration"):
              name=cfg.findtext("name","")
              if name=="HALO_M_KEY_PM3":
                  print("Found Halo profile:",name)
                  for opt in cfg.findall(".//option"):
                      n=opt.findtext("name","")
                      if n in ("CCIncludePath2","IlinkLibOutput","IlinkOutputFile","IlinkIcfFile"):
                          print(n, [x.text for x in opt.findall(".//state")])
          Path("halo-source-diagnostics/profile.txt").write_text("HALO_M_KEY_PM3 extracted from patched FreePad GenericApp.ewp\\n")
          PY
      - name: Upload Halo source adaptation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: halo-freepad-source-check-NOT-FIRMWARE
          path: halo-source-diagnostics/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sdcc-sdk-library-diagnostics-NOT-FIRMWARE
          path: diagnostics/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: sdcc-abi-probe-NOT-HALO-FIRMWARE
          path: probe/
          if-no-files-found: error
